<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 35% 25%,
          #1f3a7a,
          #0a1e4d 58%,
          #051438
        );
      }
      svg {
        width: 76%;
        height: 76%;
        filter: drop-shadow(0 28px 28px rgba(0, 0, 0, 0.22));
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 512 512" role="img" aria-label="BiSell AutoIQ">
      <polygon
        points="256,34 444,142 444,370 256,478 68,370 68,142"
        fill="#ffc72c"
      />
      <polygon
        points="256,94 392,172 392,340 256,418 120,340 120,172"
        fill="#0a1e4d"
      />
      <text
        x="256"
        y="320"
        text-anchor="middle"
        fill="#ffc72c"
        font-size="188"
        font-weight="900"
        font-family="Arial, sans-serif"
      >
        B
      </text>
    </svg>
  </body>
</html>
