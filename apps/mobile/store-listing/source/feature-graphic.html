<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        background: linear-gradient(
          120deg,
          #051438 0%,
          #0a1e4d 58%,
          #17306a 100%
        );
        color: white;
        font-family: Arial, sans-serif;
      }
      .content {
        position: absolute;
        inset: 0;
        padding: 58px 56px;
        z-index: 2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand svg {
        width: 58px;
        height: 58px;
      }
      .wordmark {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .strapline {
        color: #ffc72c;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 4px;
      }
      h1 {
        width: 520px;
        margin: 58px 0 18px;
        font-size: 53px;
        line-height: 0.98;
        letter-spacing: -2px;
      }
      p {
        width: 470px;
        margin: 0;
        color: rgba(255, 255, 255, 0.76);
        font-size: 20px;
        line-height: 1.35;
      }
      .car {
        position: absolute;
        right: -62px;
        bottom: -26px;
        width: 610px;
        z-index: 1;
        filter: drop-shadow(0 30px 30px rgba(0, 0, 0, 0.38));
      }
      .accent {
        position: absolute;
        right: 45px;
        top: 36px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: #ffc72c;
        opacity: 0.16;
        filter: blur(2px);
      }
    </style>
  </head>
  <body>
    <div class="accent"></div>
    <div class="content">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#ffc72c" />
          <polygon points="20,7 32,14 32,27 20,34 8,27 8,14" fill="#0a1e4d" />
          <text
            x="20"
            y="25"
            text-anchor="middle"
            fill="#ffc72c"
            font-size="12"
            font-weight="900"
          >
            B
          </text>
        </svg>
        <div>
          <div class="wordmark">BiSell.</div>
          <div class="strapline">AUTO·IQ</div>
        </div>
      </div>
      <h1>Buy and sell with the facts up front.</h1>
      <p>Zimbabwe’s trust-first vehicle marketplace.</p>
    </div>
    <img
      class="car"
      src="../../../web/public/images/honda-vezel-cutout.png"
      alt=""
    />
  </body>
</html>
